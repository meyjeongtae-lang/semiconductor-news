<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>반도체 뉴스 브리핑</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23B0692C%22/><rect x=%2228%22 y=%2228%22 width=%2244%22 height=%2244%22 rx=%228%22 fill=%22%23F5F2EA%22/></svg>">
<script src="data.js"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css');
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap');

  :root{
    --backdrop:#E1E7ED;
    --paper:#F3F5F7; --ink:#131B24; --ink-soft:#3C4854; --slate:#66727D; --line:#C7D1DA; --card:#FFFFFF;
    --copper:#3D5A80; --copper-soft:#E6ECF2; --wafer:#2F6E6D; --wafer-soft:#E1EEEC;
    --graphite:#4B5560; --graphite-soft:#E7EAED; --moss:#3D7A63; --moss-soft:#E1EDE7;
    --shadow:0 1px 2px rgba(19,27,36,.05), 0 1px 1px rgba(19,27,36,.03);
    --shadow-hover:0 10px 24px -12px rgba(19,27,36,.18), 0 2px 6px rgba(19,27,36,.06);
    --hero-a:#E2E8EF; --hero-b:#F6F8FA;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --backdrop:#080B0F;
      --paper:#10161D; --ink:#E8EDF2; --ink-soft:#B7C1CA; --slate:#7E8B96; --line:#324150; --card:#161E27;
      --copper:#7B9FC4; --copper-soft:#1C2C3D; --wafer:#5FA6A0; --wafer-soft:#132523;
      --graphite:#A7B1BA; --graphite-soft:#1D262F; --moss:#6BAE93; --moss-soft:#132420;
      --shadow:0 1px 2px rgba(0,0,0,.3);
      --shadow-hover:0 14px 28px -14px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.35);
      --hero-a:#161E27; --hero-b:#10161D;
    }
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--backdrop);color:var(--ink);font-family:'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  .mono{font-family:ui-monospace,'SF Mono',Consolas,monospace;font-variant-numeric:tabular-nums;}
  .wrap{max-width:820px;margin:0 auto;padding:0 20px 100px;}

  /* 페이지 전체를 감싸는 프레임 — 배경(--backdrop)과 콘텐츠(--paper)를 색 차이로 분리해서
     "화면에 종이 한 장이 놓여 있는" 느낌을 준다 */
  .page-frame{
    max-width:900px;margin:24px 16px;background:var(--paper);
    border:1px solid var(--line);border-radius:20px;
    box-shadow:var(--shadow-hover);
  }
  @media (min-width:940px){
    .page-frame{margin:32px auto;}
  }
  ::selection{background:var(--copper-soft);color:var(--copper);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:2px solid var(--paper);}

  /* ---------- Hero ---------- */
  header{
    position:relative;
    padding:56px 20px 32px;
    background:
      radial-gradient(560px 220px at 12% -10%, var(--copper-soft) 0%, transparent 65%),
      radial-gradient(520px 220px at 100% 0%, var(--wafer-soft) 0%, transparent 60%),
      linear-gradient(180deg, var(--hero-a), var(--hero-b));
    border-bottom:1px solid var(--line);
    border-radius:20px 20px 0 0;
    overflow:hidden;
  }
  header::before{
    content:'';
    position:absolute; inset:0;
    background-image:radial-gradient(currentColor 1px, transparent 1px);
    background-size:22px 22px;
    color:var(--ink);
    opacity:.035;
    mask-image:linear-gradient(180deg, black, transparent 85%);
    pointer-events:none;
  }
  .header-inner{max-width:820px;margin:0 auto;position:relative;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:7px;
    font-size:11.5px;letter-spacing:.14em;font-weight:600;
    padding:6px 12px 6px 10px;border-radius:999px;
    border:1px solid var(--line);color:var(--copper);background:var(--card);
    box-shadow:var(--shadow);
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--copper);box-shadow:0 0 0 3px var(--copper-soft);}
  h1{
    font-family:'Noto Serif KR',serif;
    font-weight:700;
    font-size:clamp(28px,4.6vw,38px);
    margin:16px 0 10px;
    letter-spacing:-.015em;
    line-height:1.25;
  }
  .sub{color:var(--slate);font-size:14px;margin:0 0 22px;letter-spacing:-.01em;}
  .meta-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);
    color:var(--ink-soft);background:var(--card);box-shadow:var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .chip.mono{color:var(--ink);font-weight:600;}
  button.chip{cursor:pointer;font-family:inherit;}
  button.chip:hover{border-color:var(--copper);color:var(--copper);transform:translateY(-1px);}

  /* ---------- Daily brief ---------- */
  .daily-brief{
    margin:22px 0 0;padding:20px 22px;border-radius:16px;
    background:linear-gradient(155deg, var(--copper-soft), var(--card) 55%);
    border:1px solid color-mix(in srgb, var(--copper) 30%, var(--line));
    box-shadow:var(--shadow);
  }
  .daily-brief-label{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--copper);
    margin-bottom:8px;
  }
  .daily-brief-label::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--copper);}
  .daily-brief h2{
    font-family:'Noto Serif KR',serif;font-weight:700;font-size:18px;
    margin:0 0 12px;color:var(--ink);line-height:1.4;
  }
  .daily-brief ul{margin:0;padding:0;list-style:none;}
  .daily-brief li{
    font-size:13.5px;line-height:1.7;color:var(--ink-soft);
    padding-left:16px;position:relative;margin-bottom:8px;
  }
  .daily-brief li:last-child{margin-bottom:0;}
  .daily-brief li::before{
    content:'';position:absolute;left:0;top:9px;width:5px;height:5px;
    border-radius:50%;background:var(--copper);
  }

  /* 주별 보기 안에서 각 주 상단에 끼워 넣는 요약 카드 (daily-brief와 같은 구조, 색만 wafer로 구분) */
  .weekly-brief{
    margin:0 0 14px;padding:18px 20px;border-radius:14px;
    background:linear-gradient(155deg, var(--wafer-soft), var(--card) 55%);
    border:1px solid color-mix(in srgb, var(--wafer) 30%, var(--line));
    box-shadow:var(--shadow);
  }
  .weekly-brief .daily-brief-label{color:var(--wafer);}
  .weekly-brief .daily-brief-label::before{background:var(--wafer);}
  .weekly-brief h2{font-size:16px;}
  .weekly-brief li::before{background:var(--wafer);}

  /* 주별 보기에서 한 주씩만 넘겨보는 네비게이션 */
  .week-nav{
    display:none;align-items:center;justify-content:center;gap:10px;
    padding:4px 0 18px;
  }
  .week-nav-btn{
    width:34px;height:34px;flex:none;border-radius:999px;border:1px solid var(--line);
    background:var(--card);color:var(--ink-soft);font-size:16px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .15s ease;
  }
  .week-nav-btn:hover:not(:disabled){border-color:var(--wafer);color:var(--wafer);transform:translateY(-1px);}
  .week-nav-btn:disabled{opacity:.3;cursor:default;}
  .week-select{
    font-size:13px;font-weight:600;color:var(--ink);padding:8px 16px;border-radius:999px;
    border:1px solid var(--line);background:var(--card);cursor:pointer;font-family:inherit;
    max-width:220px;
  }

  /* ---------- Controls ---------- */
  .control-bar{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;
    padding:18px 0;position:sticky;top:0;z-index:5;
    background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:blur(10px) saturate(140%);
    -webkit-backdrop-filter:blur(10px) saturate(140%);
    border-bottom:1px solid transparent;
    transition:border-color .2s ease;
  }
  .filters{display:flex;flex-wrap:wrap;gap:8px;}
  .filters button{
    font-size:13px;cursor:pointer;border:1px solid var(--line);padding:7px 13px;border-radius:999px;
    background:var(--card);color:var(--ink-soft);font-weight:500;
    transition:all .15s ease;
  }
  .filters button:hover{border-color:var(--copper);color:var(--copper);transform:translateY(-1px);}
  .filters button.active{border-color:var(--copper);color:#fff;background:var(--copper);box-shadow:0 4px 12px -4px rgba(61,90,128,.5);}
  .cat-filters{padding:0 0 18px;}
  .cat-filters button{font-size:12px;padding:6px 12px;}
  .groupswitch{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card);}
  .groupswitch button{font-size:12.5px;cursor:pointer;border:none;padding:7px 13px;border-radius:999px;background:transparent;color:var(--ink-soft);font-weight:500;transition:all .15s ease;}
  .groupswitch button.active{background:var(--copper);color:#fff;}

  /* ---------- Groups ---------- */
  .group-header{
    display:flex;align-items:center;gap:10px;
    font-size:12.5px;font-weight:700;color:var(--ink-soft);
    padding:28px 0 12px;letter-spacing:.01em;
    scroll-margin-top:74px;
  }
  .group-header.flash{animation:flash-highlight 1.1s ease;}
  @keyframes flash-highlight{
    0%{color:var(--copper);}
    100%{color:var(--ink-soft);}
  }
  .group-header::before{content:'';width:14px;height:2px;border-radius:2px;background:var(--copper);}
  .group-header .count{font-weight:500;color:var(--slate);font-family:ui-monospace,Consolas,monospace;font-size:11px;}
  .group-header:first-child{padding-top:4px;}

  /* ---------- Rows / cards ---------- */
  .row{
    display:grid;grid-template-columns:118px 1fr auto;gap:16px;align-items:start;
    padding:16px 18px;margin-bottom:10px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    opacity:0; animation:rise .45s ease forwards;
  }
  .row:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:color-mix(in srgb, var(--copper) 35%, var(--line));}
  @keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion:reduce){.row{animation:none;opacity:1;}}

  .tag{
    display:inline-flex;align-items:center;gap:6px;
    font-size:10.5px;font-weight:700;font-family:ui-monospace,Consolas,monospace;letter-spacing:.03em;
    padding:5px 9px;border-radius:999px;white-space:nowrap;height:fit-content;
  }
  .tag::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;}
  .tag--kr{background:var(--copper-soft);color:var(--copper);}
  .tag--corp{background:var(--wafer-soft);color:var(--wafer);}
  .tag--intl{background:var(--graphite-soft);color:var(--graphite);}
  .tag--digest{background:var(--moss-soft);color:var(--moss);}

  .body{min-width:0;}
  .body a{color:var(--ink);text-decoration:none;font-weight:600;font-size:15.5px;line-height:1.5;background-image:linear-gradient(var(--copper),var(--copper));background-repeat:no-repeat;background-position:0 100%;background-size:0% 1.5px;transition:background-size .2s ease,color .15s ease;overflow-wrap:anywhere;}
  .body a:hover{color:var(--copper);background-size:100% 1.5px;}
  .body p{margin:6px 0 0;font-size:13px;color:var(--ink-soft);line-height:1.65;overflow-wrap:anywhere;}
  .src{font-size:11px;color:var(--slate);margin-top:6px;display:flex;align-items:center;gap:6px;overflow-wrap:anywhere;}
  .src::before{content:'';width:3px;height:3px;border-radius:50%;background:var(--slate);}
  .date{font-size:12px;color:var(--slate);white-space:nowrap;padding-top:2px;}
  .empty{padding:64px 0;color:var(--slate);text-align:center;font-size:14px;}
  .empty::before{content:'◌';display:block;font-size:28px;margin-bottom:10px;color:var(--line);}

  .explain{margin-top:10px;}
  .explain summary{
    cursor:pointer;font-size:12px;font-weight:600;color:var(--moss);list-style:none;
    display:inline-flex;align-items:center;gap:5px;
    padding:5px 10px;border-radius:999px;background:var(--moss-soft);
    transition:filter .15s ease;
  }
  .explain summary:hover{filter:brightness(1.08);}
  .explain summary::-webkit-details-marker{display:none;}
  .explain summary::after{content:'▸';font-size:9px;transition:transform .2s ease;}
  .explain[open] summary::after{transform:rotate(90deg);}
  .explain[open] summary{margin-bottom:10px;}
  .explain-box{
    background:var(--moss-soft);border-left:3px solid var(--moss);border-radius:4px 10px 10px 4px;
    padding:14px 16px;font-size:13.5px;line-height:1.75;color:var(--ink-soft);
    overflow-wrap:anywhere;
  }
  .explain-box p{margin:0 0 12px;}
  .explain-box p:last-child{margin-bottom:0;}

  /* ---------- Pagination ---------- */
  .pagination{
    display:none;align-items:center;justify-content:center;gap:12px;
    padding:22px 0 8px;
  }
  .page-btn{
    font-size:13px;font-weight:600;cursor:pointer;padding:9px 16px;border-radius:10px;
    border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
    transition:all .15s ease;
  }
  .page-btn:hover:not(:disabled){border-color:var(--copper);color:var(--copper);transform:translateY(-1px);}
  .page-btn:disabled{opacity:.35;cursor:default;}
  .page-info{font-size:12.5px;color:var(--slate);font-family:ui-monospace,Consolas,monospace;min-width:64px;text-align:center;}

  footer{max-width:820px;margin:0 auto;padding:36px 20px 60px;color:var(--slate);font-size:12px;text-align:center;border-top:1px solid var(--line);}

  @media (max-width:640px){
    .row{grid-template-columns:1fr;gap:8px;}
    .date{order:-1;}
  }
</style>
</head>
<body>
<div class="page-frame">
<header>
  <div class="header-inner">
    <span class="eyebrow"><span class="dot"></span>SEMICONDUCTOR NEWS · LOCAL DIGEST</span>
    <h1>반도체 뉴스 브리핑</h1>
    <p class="sub" id="fetchedAt">수집 시각 확인 중...</p>
    <div class="meta-row" id="metaRow"></div>
  </div>
</header>
<div class="wrap">
  <div id="dailyBrief"></div>
  <div class="control-bar">
    <div class="filters" id="filters"></div>
    <div class="groupswitch" id="groupswitch">
      <button data-group="source" class="active">소스별</button>
      <button data-group="date">날짜별</button>
      <button data-group="week">주별</button>
    </div>
  </div>
  <div class="filters cat-filters" id="categoryFilters"></div>
  <div class="week-nav" id="weekNav">
    <button type="button" class="week-nav-btn" id="weekPrev" aria-label="이전 주">‹</button>
    <select class="week-select" id="weekSelect"></select>
    <button type="button" class="week-nav-btn" id="weekNext" aria-label="다음 주">›</button>
  </div>
  <div id="list"></div>
  <div class="pagination" id="pagination"></div>
</div>
<footer>반도체 업계 소식을 자동으로 수집해 정리합니다.</footer>
</div>

<script>
  const payload = window.NEWS_DATA || { fetchedAt: null, items: [] };
  const items = payload.items || [];
  let explanations = {};
  let weeklyBriefs = {};
  let state = { filter: 'all', category: 'all', group: 'source', week: null, page: 1 };
  let lastWeekOrder = [];
  const PAGE_SIZE = 20;

  // fetch-news.js가 매긴 카테고리(item.category)를 화면에 보여줄 한글 라벨과 표시 순서.
  // fetch-news.js의 CATEGORIES 목록과 key·순서를 맞춰뒀다 — 저기서 카테고리를 추가/변경하면 여기도 같이 바꿔야 한다.
  const CATEGORY_META = [
    { key: 'memory', label: '메모리' },
    { key: 'ai-compute', label: 'AI 반도체·컴퓨팅' },
    { key: 'foundry', label: '파운드리·제조공정' },
    { key: 'security', label: '보안·검증' },
    { key: 'research', label: '연구·기술동향' },
    { key: 'earnings', label: '기업실적·투자' },
    { key: 'deals', label: '인수합병·투자유치' },
    { key: 'legal', label: '특허·소송' },
    { key: 'labor', label: '인력·노사' },
    { key: 'policy', label: '정책·무역' },
    { key: 'market', label: '시장·거시경제' },
    { key: 'robotics', label: '로보틱스·자동차' },
    { key: 'etc', label: '기타' },
  ];
  const CATEGORY_LABELS = Object.fromEntries(CATEGORY_META.map((c) => [c.key, c.label]));

  function relativeTime(d) {
    const diffMs = Date.now() - new Date(d).getTime();
    const min = Math.floor(diffMs / 60000);
    if (min < 1) return '방금 전';
    if (min < 60) return `${min}분 전`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return `${hr}시간 전`;
    return `${Math.floor(hr / 24)}일 전`;
  }

  document.getElementById('fetchedAt').textContent = payload.fetchedAt
    ? `마지막 수집 ${new Date(payload.fetchedAt).toLocaleString('ko-KR')} · ${relativeTime(payload.fetchedAt)}`
    : 'data.js가 없습니다. node fetch-news.js를 먼저 실행하세요.';

  const bySource = {};
  items.forEach(it => { bySource[it.source] = (bySource[it.source] || 0) + 1; });

  function sourceSlug(s) {
    return 'src-' + encodeURIComponent(s).replace(/%/g, '');
  }

  document.getElementById('metaRow').innerHTML =
    `<span class="chip mono">기사 ${items.length}건</span>` +
    `<span class="chip mono">소스 ${Object.keys(bySource).length}곳</span>` +
    Object.keys(bySource).map(s =>
      `<button type="button" class="chip" data-source="${escapeHtml(s)}">${escapeHtml(s)} ${bySource[s]}</button>`
    ).join('');

  document.getElementById('metaRow').addEventListener('click', e => {
    const btn = e.target.closest('button[data-source]');
    if (!btn) return;
    goToSource(btn.dataset.source);
  });

  function goToSource(source) {
    // 소스별 보기로 전환 + 필터 초기화(안 그러면 필터 때문에 해당 소스 기사가 안 보일 수 있음)
    state.group = 'source';
    state.filter = 'all';
    document.querySelectorAll('#groupswitch button').forEach(b => b.classList.toggle('active', b.dataset.group === 'source'));
    document.querySelectorAll('.filters button').forEach(b => b.classList.toggle('active', b.dataset.type === 'all'));

    // 해당 소스가 몇 번째 페이지에 있는지 먼저 계산해서 그 페이지로 이동한다
    // (페이지가 나뉘어 있어서, 목표 소스의 헤더가 지금 페이지에 없을 수도 있기 때문)
    const order = [];
    const groups = {};
    items.forEach(it => {
      if (!groups[it.source]) { groups[it.source] = []; order.push(it.source); }
      groups[it.source].push(it);
    });
    let flatIndex = 0, found = -1;
    for (const key of order) {
      if (key === source) { found = flatIndex; break; }
      flatIndex += groups[key].length;
    }
    state.page = found === -1 ? 1 : Math.floor(found / PAGE_SIZE) + 1;

    render();
    const target = document.getElementById(sourceSlug(source));
    if (target) {
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      target.classList.remove('flash');
      void target.offsetWidth;
      target.classList.add('flash');
    }
  }

  const TAG_LABEL = { kr: 'KR PRESS', corp: 'CORP', intl: 'GLOBAL', digest: 'DIGEST' };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function formatDate(d) {
    const date = new Date(d);
    if (isNaN(date)) return '';
    return date.toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit' }) + ' ' +
      date.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  }

  // "오늘 · 07.27" / "어제 · 07.26" / "07.20" 같은 날짜 그룹 라벨 만들기
  function dateGroupLabel(d) {
    const date = new Date(d);
    if (isNaN(date)) return '날짜 미상';
    const today = new Date(); today.setHours(0,0,0,0);
    const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
    const target = new Date(date); target.setHours(0,0,0,0);
    const md = date.toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit' });
    if (target.getTime() === today.getTime()) return `오늘 · ${md}`;
    if (target.getTime() === yesterday.getTime()) return `어제 · ${md}`;
    return md;
  }

  function dateGroupKey(d) {
    const date = new Date(d);
    if (isNaN(date)) return '0000-00-00';
    // toISOString()은 UTC 기준이라 한국 시간(KST) 자정 근처 기사가 엉뚱한 날짜로 묶이는 문제가 있어서,
    // 화면에 보이는 날짜(로컬 시간) 기준으로 그룹 키를 만든다.
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  // 그 주의 월요일 자정을 반환 (일요일은 0으로 나오는 걸 보정해서 항상 월요일을 시작으로 삼는다)
  function getWeekStart(d) {
    const date = new Date(d);
    date.setHours(0, 0, 0, 0);
    const day = date.getDay();
    const diff = (day === 0 ? -6 : 1) - day;
    date.setDate(date.getDate() + diff);
    return date;
  }

  function weekGroupKey(d) {
    const date = new Date(d);
    if (isNaN(date)) return '0000-00-00';
    const start = getWeekStart(date);
    const y = start.getFullYear();
    const m = String(start.getMonth() + 1).padStart(2, '0');
    const day = String(start.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  // "이번 주 · 07.21~07.27" / "지난 주 · 07.14~07.20" / "07.07~07.13" 같은 라벨 만들기
  function weekGroupLabel(d) {
    const date = new Date(d);
    if (isNaN(date)) return '날짜 미상';
    const start = getWeekStart(date);
    const end = new Date(start);
    end.setDate(start.getDate() + 6);
    const thisWeekStart = getWeekStart(new Date());
    const lastWeekStart = new Date(thisWeekStart);
    lastWeekStart.setDate(thisWeekStart.getDate() - 7);
    const md = (dt) => dt.toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit' });
    const range = `${md(start)}~${md(end)}`;
    if (start.getTime() === thisWeekStart.getTime()) return `이번 주 · ${range}`;
    if (start.getTime() === lastWeekStart.getTime()) return `지난 주 · ${range}`;
    return range;
  }

  function rowHtml(it, i) {
    const entry = explanations[it.link];
    // 원문 사이트가 자동으로 주는 짧은 스니펫(it.desc) 대신, 직접 읽고 쓴 요약(summary)만 보여준다.
    // summary가 아직 없는 기사는 본문 미리보기 없이 제목만 보인다.
    const summary = entry && entry.summary;
    const detail = entry && entry.detail;
    const catLabel = CATEGORY_LABELS[it.category];
    return `
      <div class="row" style="animation-delay:${Math.min(i, 24) * 18}ms">
        <span class="tag tag--${it.type}">${TAG_LABEL[it.type] || it.type}</span>
        <div class="body">
          <a href="${it.link}" target="_blank" rel="noopener">${escapeHtml(it.title)}</a>
          ${summary ? `<p>${escapeHtml(summary)}</p>` : ''}
          <div class="src">${escapeHtml(it.source)}${catLabel ? ' · ' + escapeHtml(catLabel) : ''}</div>
          ${detail ? `
            <details class="explain">
              <summary>🔰 친절한 설명 보기</summary>
              <div class="explain-box">${detail.split('\n\n').map(p => `<p>${escapeHtml(p)}</p>`).join('')}</div>
            </details>
          ` : ''}
        </div>
        <span class="date mono">${formatDate(it.date)}</span>
      </div>
    `;
  }

  // 주별 네비게이션(이전/다음 버튼, 드롭다운)을 현재 상태에 맞게 다시 그린다
  function renderWeekNav(order) {
    const sel = document.getElementById('weekSelect');
    sel.innerHTML = order.map(key =>
      `<option value="${key}"${key === state.week ? ' selected' : ''}>${escapeHtml(weekGroupLabel(new Date(key + 'T00:00:00')))}</option>`
    ).join('');
    const idx = order.indexOf(state.week);
    document.getElementById('weekPrev').disabled = idx === -1 || idx >= order.length - 1;
    document.getElementById('weekNext').disabled = idx <= 0;
  }

  // 페이지 이동 버튼/숫자를 그린다. totalPages가 1 이하면 아예 숨긴다.
  function renderPagination(totalPages) {
    const box = document.getElementById('pagination');
    if (totalPages <= 1) { box.style.display = 'none'; box.innerHTML = ''; return; }
    box.style.display = 'flex';
    box.innerHTML = `
      <button type="button" class="page-btn" id="pagePrev" ${state.page <= 1 ? 'disabled' : ''}>‹ 이전</button>
      <span class="page-info">${state.page} / ${totalPages}</span>
      <button type="button" class="page-btn" id="pageNext" ${state.page >= totalPages ? 'disabled' : ''}>다음 ›</button>
    `;
    document.getElementById('pagePrev').addEventListener('click', () => {
      if (state.page > 1) { state.page--; render(); scrollListToTop(); }
    });
    document.getElementById('pageNext').addEventListener('click', () => {
      if (state.page < totalPages) { state.page++; render(); scrollListToTop(); }
    });
  }

  function scrollListToTop() {
    document.getElementById('list').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // 소스별/날짜별 보기: 여러 그룹을 순서대로 나열한 뒤, 항목 단위(PAGE_SIZE개)로 페이지를 나눈다.
  // 그룹 하나가 페이지 경계를 넘어가면, 다음 페이지에서도 그 그룹의 헤더를 다시 보여준다.
  function renderGroupedView(filtered, keyFn, labelFn, idFn) {
    const order = [];
    const groups = {};
    filtered.forEach(it => {
      const key = keyFn(it);
      if (!groups[key]) { groups[key] = { label: labelFn(it), items: [] }; order.push(key); }
      groups[key].items.push(it);
    });

    const flat = [];
    order.forEach(key => groups[key].items.forEach(it => flat.push({ it, key })));

    const totalPages = Math.max(1, Math.ceil(flat.length / PAGE_SIZE));
    if (state.page > totalPages) state.page = totalPages;
    if (state.page < 1) state.page = 1;
    const start = (state.page - 1) * PAGE_SIZE;
    const pageSlice = flat.slice(start, start + PAGE_SIZE);

    let html = '';
    let lastKey = null;
    let i = 0;
    pageSlice.forEach(({ it, key }) => {
      if (key !== lastKey) {
        const idAttr = idFn ? ` id="${idFn(key)}"` : '';
        html += `<div class="group-header"${idAttr}>${escapeHtml(groups[key].label)}<span class="count">${groups[key].items.length}</span></div>`;
        lastKey = key;
      }
      html += rowHtml(it, i++);
    });

    document.getElementById('list').innerHTML = html;
    renderPagination(totalPages);
  }

  function renderWeekView(filtered) {
    const groups = {};
    filtered.forEach(it => {
      const key = weekGroupKey(it.date);
      if (!groups[key]) { groups[key] = { label: weekGroupLabel(it.date), items: [] }; }
      groups[key].items.push(it);
    });
    // 최신 주가 맨 앞에 오도록 정렬 (한 주씩만 보여주고 화살표/드롭다운으로 이동)
    const order = Object.keys(groups).sort().reverse();
    const weekChanged = state.week && !groups[state.week];
    lastWeekOrder = order;
    if (!state.week || !groups[state.week]) { state.week = order[0]; }
    if (weekChanged) state.page = 1;

    document.getElementById('weekNav').style.display = 'flex';
    renderWeekNav(order);

    const cur = groups[state.week];
    if (!cur) {
      document.getElementById('list').innerHTML = '<div class="empty">표시할 뉴스가 없습니다.</div>';
      document.getElementById('pagination').style.display = 'none';
      return;
    }

    const totalPages = Math.max(1, Math.ceil(cur.items.length / PAGE_SIZE));
    if (state.page > totalPages) state.page = totalPages;
    if (state.page < 1) state.page = 1;
    const start = (state.page - 1) * PAGE_SIZE;
    const pageItems = cur.items.slice(start, start + PAGE_SIZE);

    const brief = weeklyBriefs[state.week];
    // "이 주의 요약"은 페이지를 넘겨도 반복해서 보여줄 필요가 없으므로 1페이지에서만 보여준다.
    const briefHtml = (state.page === 1 && brief) ? `
      <div class="weekly-brief">
        <div class="daily-brief-label">이 주의 요약</div>
        <h2>${escapeHtml(brief.headline || '')}</h2>
        <ul>${(brief.points || []).map(p => `<li>${escapeHtml(p)}</li>`).join('')}</ul>
      </div>
    ` : '';

    let i = 0;
    document.getElementById('list').innerHTML = `
      <div class="group-header">${escapeHtml(cur.label)}<span class="count">${cur.items.length}</span></div>
      ${briefHtml}
      ${pageItems.map(it => rowHtml(it, i++)).join('')}
    `;
    renderPagination(totalPages);
  }

  // 카테고리 필터 칩(전체 + 데이터에 실제로 존재하는 카테고리만)을 그린다.
  function renderCategoryFilters() {
    const byCategory = {};
    items.forEach((it) => { const k = it.category || 'etc'; byCategory[k] = (byCategory[k] || 0) + 1; });
    const box = document.getElementById('categoryFilters');
    const chips = [`<button type="button" data-category="all" class="${state.category === 'all' ? 'active' : ''}">전체</button>`];
    CATEGORY_META.forEach((c) => {
      if (!byCategory[c.key]) return;
      chips.push(`<button type="button" data-category="${c.key}" class="${state.category === c.key ? 'active' : ''}">${escapeHtml(c.label)} ${byCategory[c.key]}</button>`);
    });
    box.innerHTML = chips.join('');
  }

  function render() {
    const list = document.getElementById('list');
    const weekNav = document.getElementById('weekNav');
    const filtered = items.filter((it) =>
      (state.filter === 'all' || it.type === state.filter) &&
      (state.category === 'all' || it.category === state.category)
    );

    if (filtered.length === 0) {
      weekNav.style.display = 'none';
      document.getElementById('pagination').style.display = 'none';
      list.innerHTML = '<div class="empty">표시할 뉴스가 없습니다.</div>';
      return;
    }

    if (state.group === 'week') {
      renderWeekView(filtered);
    } else if (state.group === 'source') {
      weekNav.style.display = 'none';
      // 소스가 등장하는 순서(=최신 기사가 있는 소스 순)대로 그룹 구성
      renderGroupedView(filtered, it => it.source, it => it.source, key => sourceSlug(key));
    } else {
      weekNav.style.display = 'none';
      renderGroupedView(filtered, it => dateGroupKey(it.date), it => dateGroupLabel(it.date), null);
    }
  }

  const TYPES = [['all','전체'], ['kr','KR 언론'], ['corp','기업 뉴스룸'], ['intl','해외 전문지'], ['digest','업계 요약']];
  document.getElementById('filters').innerHTML = TYPES.map(([t, label], i) =>
    `<button data-type="${t}" class="${i === 0 ? 'active' : ''}">${label}</button>`
  ).join('');
  document.querySelectorAll('#filters button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#filters button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.filter = btn.dataset.type;
      state.page = 1;
      render();
    });
  });

  renderCategoryFilters();
  document.getElementById('categoryFilters').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-category]');
    if (!btn) return;
    state.category = btn.dataset.category;
    state.page = 1;
    renderCategoryFilters();
    render();
  });

  document.querySelectorAll('#groupswitch button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#groupswitch button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.group = btn.dataset.group;
      state.page = 1;
      render();
    });
  });

  document.getElementById('weekPrev').addEventListener('click', () => {
    const idx = lastWeekOrder.indexOf(state.week);
    if (idx !== -1 && idx < lastWeekOrder.length - 1) { state.week = lastWeekOrder[idx + 1]; state.page = 1; render(); }
  });
  document.getElementById('weekNext').addEventListener('click', () => {
    const idx = lastWeekOrder.indexOf(state.week);
    if (idx > 0) { state.week = lastWeekOrder[idx - 1]; state.page = 1; render(); }
  });
  document.getElementById('weekSelect').addEventListener('change', (e) => {
    state.week = e.target.value;
    state.page = 1;
    render();
  });

  const controlBar = document.querySelector('.control-bar');
  window.addEventListener('scroll', () => {
    controlBar.style.borderBottomColor = window.scrollY > 8 ? 'var(--line)' : 'transparent';
  });

  fetch('explanations.json')
    .then(res => res.ok ? res.json() : {})
    .catch(() => ({}))
    .then(data => { explanations = data || {}; render(); });

  // 주별 보기에서 각 주 상단에 끼워 넣을 "이 주의 요약"(weekly-brief.json)
  fetch('weekly-brief.json')
    .then(res => res.ok ? res.json() : {})
    .catch(() => ({}))
    .then(data => { weeklyBriefs = data || {}; render(); });

  // "오늘의 주요 뉴스" - 그날 가장 중요한 흐름을 손으로 정리해둔 요약(daily-brief.json)이 있으면 상단에 보여준다.
  fetch('daily-brief.json')
    .then(res => res.ok ? res.json() : {})
    .catch(() => ({}))
    .then(data => {
      const todayKey = dateGroupKey(new Date());
      const brief = (data || {})[todayKey];
      const box = document.getElementById('dailyBrief');
      if (!brief) { box.innerHTML = ''; return; }
      box.innerHTML = `
        <div class="daily-brief">
          <div class="daily-brief-label">오늘의 주요 뉴스</div>
          <h2>${escapeHtml(brief.headline || '')}</h2>
          <ul>${(brief.points || []).map(p => `<li>${escapeHtml(p)}</li>`).join('')}</ul>
        </div>
      `;
    });

  render();
</script>
</body>
</html>
